ilt:\n  /nix/store/wcxg82qw7lxa589s2v2g29619cz8sf7b-logos-accounts_module-module-lib-install.drv\nthese 2 paths will be fetched (6.1 MiB download, 6.9 MiB unpacked):\n  /nix/store/mrhkrkhjpsp3jc0k9d7j6n3d45p34lig-logos-accounts_module-module-lib-lgx-1.0.0\n  /nix/store/l2kcbdg9hn7lb053lx111smrvi88jl38-logos-package-manager-cli-1.0.0\ncopying path '/nix/store/mrhkrkhjpsp3jc0k9d7j6n3d45p34lig-logos-accounts_module-module-lib-lgx-1.0.0' from 'https://logos-co.cachix.org'...\ncopying path '/nix/store/l2kcbdg9hn7lb053lx111smrvi88jl38-logos-package-manager-cli-1.0.0' from 'https://logos-co.cachix.org'...\nbuilding '/nix/store/wcxg82qw7lxa589s2v2g29619cz8sf7b-logos-accounts_module-module-lib-install.drv'...\n", "note": ""}]}, {"md": "## Step 3: List the module's methods\n\nIntrospect `accounts_module` with `--list-methods`. This is an offline read of\nthe plugin's method surface \u2014 no runtime needed. A universal module like\n`accounts_module` exposes its methods through a provider object, and the viewer\nsurfaces them all.", "execs": []}, {"md": "### 3.1 Introspect\n\n```bash\nQT_QPA_PLATFORM=offscreen logos-module-viewer \\\n  --module accounts_module_plugin.so --list-methods\n```\n\nThe viewer prints the module's name, version, and full method list. These\nare the same methods the GUI shows as expandable call forms, and the same\nones you can drive with `--call` below.", "execs": [{"kind": "run", "cmd": "PLUGIN=$(ls ./accounts/modules/accounts_module/accounts_module_plugin.*)\nQT_QPA_PLATFORM=offscreen ./viewer/bin/logos-module-viewer \\\n  --module \"$PLUGIN\" \\\n  --list-methods\n", "status": "pass", "exit_code": 0, "output": "AccountsModuleImpl: Initializing...\nAccountsModuleImpl: Initializing...\nModule:  accounts_module v1.0.0\nType:    core\nPath:    /nix/store/ai408mr4rhz2sn6sypv2y2b48c5fk5v3-logos-accounts_module-module-lib-install/modules/accounts_module/accounts_module_plugin.so\n\nMethods:\n  bool initKeystore(QString dir, int scryptN, int scryptP)\n  bool closeKeystore(QString privateKey)\n  QStringList keystoreAccounts()\n  QString keystoreNewAccount(QString passphrase)\n  QString keystoreImport(QString keyJSON, QString passphrase, QString newPassphrase)\n  QString keystoreExport(QString address, QString passphrase, QString newPassphrase)\n  bool keystoreDelete(QString address, QString passphrase)\n  bool keystoreHasAddress(QString address)\n  bool keystoreUnlock(QString address, QString passphrase)\n  bool keystoreLock(QString address)\n  bool keystoreTimedUnlock(QString address, QString passphrase, int timeoutSeconds)\n  bool keystoreUpdate(QString address, QString passphrase, QString newPassphrase)\n  QString keystoreSignHash(QString address, QString hashHex)\n  QString keystoreSignHashWithPassphrase(QString address, QString passphrase, QString hashHex)\n  QString keystoreImportECDSA(QString privateKeyHex, QString passphrase)\n  QString keystoreSignTx(QString address, QString txJSON, QString chainIDHex)\n  QString keystoreSignTxWithPassphrase(QString address, QString passphrase, QString txJSON, QString chainIDHex)\n  QString keystoreFind(QString address, QString url)\n  bool initExtKeystore(QString dir, int scryptN, int scryptP)\n  bool closeExtKeystore()\n  QStringList extKeystoreAccounts()\n  QString extKeystoreNewAccount(QString passphrase)\n  QString extKeystoreImport(QString keyJSON, QString passphrase, QString newPassphrase)\n  QString extKeystoreImportExtendedKey(QString extKeyStr, QString passphrase)\n  QString extKeystoreExportExt(QString address, QString passphrase, QString newPassphrase)\n  QString extKeystoreExportPriv(QString address, QString passphrase, QString newPassphrase)\n  bool extKeystoreDelete(QString address, QString passphrase)\n  bool extKeystoreHasAddress(QString address)\n  bool extKeystoreUnlock(QString address, QString passphrase)\n  bool extKeystoreLock(QString address)\n  bool extKeystoreTimedUnlock(QString address, QString passphrase, int timeoutSeconds)\n  bool extKeystoreUpdate(QString address, QString passphrase, QString newPassphrase)\n  QString extKeystoreSignHash(QString address, QString hashHex)\n  QString extKeystoreSignHashWithPassphrase(QString address, QString passphrase, QString hashHex)\n  QString extKeystoreSignTx(QString address, QString txJSON, QString chainIDHex)\n  QString extKeystoreSignTxWithPassphrase(QString address, QString passphrase, QString txJSON, QString chainIDHex)\n  QString extKeystoreDerive(QString address, QString derivationPath, int pin)\n  QString extKeystoreDeriveWithPassphrase(QString address, QString derivationPath, int pin, QString passphrase, QString newPassphrase)\n  QString extKeystoreFind(QString address, QString url)\n  QString createExtKeyFromMnemonic(QString phrase, QString passphrase)\n  QString deriveExtKey(QString extKeyStr, QString pathStr)\n  QString extKeyToECDSA(QString extKeyStr)\n  QString ecdsaToPublicKey(QString privateKeyECDSAStr)\n  QString publicKeyToAddress(QString publicKeyStr)\n  QString createRandomMnemonic(int length)\n  QString createRandomMnemonicWithDefaultLength()\n  int lengthToEntropyStrength(int length)\n", "note": ""}]}, {"md": "## Step 4: Call a method over IPC\n\nNow call a method for real. `--call` processes and loads the module into a\n`liblogos` runtime and dispatches over the Logos IPC bridge \u2014 the same path\nthe GUI's **Call Method** button takes. `lengthToEntropyStrength` maps a\nmnemonic word count to its entropy in bits, so `12` returns exactly `128`: a\ndeterministic, end-to-end round-trip into **this** module.", "execs": []}, {"md": "### 4.1 Map a word count to entropy strength\n\n```bash\nQT_QPA_PLATFORM=offscreen logos-module-viewer \\\n  --module accounts_module_plugin.so --modules-dir ./modules \\\n  --call \"lengthToEntropyStrength(12)\"\n```", "execs": [{"kind": "run", "cmd": "PLUGIN=$(ls ./accounts/modules/accounts_module/accounts_module_plugin.*)\nQT_QPA_PLATFORM=offscreen ./viewer/bin/logos-module-viewer \\\n  --module \"$PLUGIN\" \\\n  --modules-dir ./accounts/modules \\\n  --call \"lengthToEntropyStrength(12)\"\n", "status": "pass", "exit_code": 0, "output": "AccountsModuleImpl: Initializing...\nAccountsModuleImpl: Initializing...\n[2026-06-16 22:54:56.002] [warning] [logos] No valid metadata for module: ./accounts/modules/accounts_module/accounts_module_plugin.so\n[2026-06-16 22:54:56.002] [warning] [logos] Failed to process module: ./accounts/modules/accounts_module/accounts_module_plugin.so\n[2026-06-16 22:54:56.002] [warning] [logos] Module accounts_module carries no usable logos_protocol_version (pre-protocol build) \u2014 loading permissively\n[2026-06-16 22:54:56.054] [info] [logos] Module loaded: accounts_module\n[2026-06-16 22:54:56.057] [info] [logos] [accounts_module] AccountsModuleImpl: Initializing...\n[2026-06-16 22:54:56.294] [info] [logos] [accounts_module] AccountsModuleImpl::lengthToEntropyStrength 12\nlengthToEntropyStrength(12) => {\"result\":128}\n", "note": ""}]}, {"md": "### 4.2 Generate a random mnemonic\n\n`createRandomMnemonic` returns a fresh BIP-39 phrase \u2014 a real round-trip\nthrough the go-wallet-sdk library wrapped by the module. The phrase is\nrandom, so we assert only that a result came back.\n\n```bash\nQT_QPA_PLATFORM=offscreen logos-module-viewer \\\n  --module accounts_module_plugin.so --modules-dir ./modules \\\n  --call \"createRandomMnemonic(12)\"\n```\n\nEach `--call` is a real dispatch into **this** `accounts_module` over the\nLogos bridge: `lengthToEntropyStrength(12)` returns exactly `128`, and\n`createRandomMnemonic(12)` returns a twelve-word phrase \u2014 the same values\nthe GUI would display in each method's result panel.", "execs": [{"kind": "run", "cmd": "PLUGIN=$(ls ./accounts/modules/accounts_module/accounts_module_plugin.*)\nQT_QPA_PLATFORM=offscreen ./viewer/bin/logos-module-viewer \\\n  --module \"$PLUGIN\" \\\n  --modules-dir ./accounts/modules \\\n  --call \"createRandomMnemonic(12)\"\n", "status": "pass", "exit_code": 0, "output": "Accounts nd": "run", "cmd": "nix build 'github:logos-co/logos-qt-mcp' -o result-mcp", "status": "pass", "exit_code": 0, "output": "", "note": ""}]}, {"md": "### 5.2 Launch the window and drive it\n\nThe window opens, loads `accounts_module`, and renders its methods. We\nwait for the module to appear, screenshot the loaded inspector, invoke a\nmethod through its **Call** button (a real round-trip over the Logos\nbridge, exactly as a click would do), and screenshot the result.\n\n```bash\nLOGOS_MODULE_VIEWER_MODULE=\"$(ls $PWD/accounts/modules/accounts_module/accounts_module_plugin.*)\" \\\nLOGOS_MODULE_VIEWER_MODULES_DIR=\"$PWD/accounts/modules\" \\\nnix run \"${MODULE_VIEWER_SRC:-github:logos-co/logos-module-viewer/2d91c43c11aef839cbea518c135ef6154ab08877}#app\"\n\n```\n\n![Window loads accounts_module](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA+gAAAMgCAIAAAA/et9qAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAgAElEQVR4nOzdd0Acx7048O/s9X5HPY7eRBEdgUAFCcmSJVvFllzi2I5TXvISO+U5zWmOn3/pL3kvvccpTuJeZMnqHYQaCCEEiF4OOOpxx/W2O78/DhCIQxTLRljfz1/otDs7O7M7+93Z2VkSExMDCCGEEEIIodsbs9gZQAghhBBCCM0OA3eEEEIIIYSWAAzcEUIIIYQQWgIwcEcIIYQQQmgJwMAdIYQQQgihJQADd4QQQgghhJYADNwRQgghhBBaAjBwRwghhBBCaAnAwB0hhBBCCKElAAN3hBBCCCGElgAM3BFCCCGEEFoCMHBHCCGEEEJoCcDAHSGEEEIIoSUAA3eEEEIIIYSWAAzcEUIIIYQQWgL4C16TEEIpValUYrFYKBQyDN4DIIQQQgghdCOv1+v1el0ul9VqfS/pkJiYmAWsxoiEqZ94yHL8nNtsoZSyLMtx3HvJB0IIIYQQQh9KvHEikchoNNpstgWmo1Kp5rsO4fGS77vbVV6tuXuNx+t19g9RShe2eYQQQgghhD7c/N3cPp/P5XL5h6vY7fYFpLOQoTIx2zbwOdA89VEA0MVH9bjc9jb9AtJBCCGEEELojmK1WtVqNcMwCxiuMu/AXRwSFL56BRkf0e42DLp6+uebCEIIIYQQQncmu90eFhbW3z/vEHreb5SGrsyZiNq9o9bul/aybs98E0EIIYQQQujO5PV6OY5Tq9XzXXHegbs6NXHi78GjZ1iXe74pIIQQQgghdCfjOE4oFM53rXkH7qKg6zcHTn3ffFdHCCGEEELoDufz+UQi0XzXmnfgzhNdvznw2R3zXR0hhBBCCKE7HKV0AR9Bwq8mIYQQQgghtARg4I4QQgghhNASgIE7QgghhBBCSwAG7gghhBBCCC0BGLgjhBBCCCG0BGDgjhBCCCGE0BKAgTtCCCGEEEJLAAbuCCGEEEIILQEYuCOEEEIIIbQEYOCOEEIIIYTQEoCBO0IIIYQQQksAf7EzsDSRkLztd6XKGc7edGLvpUG62PmZBYm4/39+98lUPngu/O9j3z/lnMMqglVfe+kbJWLia/nHF776Rg/3vucRIYQQQgjdFAbuC8ILzdvx <script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }
  function indexFromHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return 0;
    if (/^\d+$/.test(raw) && +raw < DATA.tutorials.length) return +raw;
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === raw || t.meta.name === raw
    );
    return i >= 0 ? i : 0;
  }
  function show(idx) { picker.value = idx; render(idx); }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    render(+picker.value);
  });
  window.addEventListener("hashchange", () => show(indexFromHash()));
  show(indexFromHash());
</script>
</body>
</html>
